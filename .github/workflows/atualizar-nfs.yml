name: Atualizar NFs em aberto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - entrada/nfs.xlsx

permissions:
  contents: write

concurrency:
  group: atualizar-nfs
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar dashboard de NFs
        uses: actions/checkout@v4

      - name: Baixar fontes corporativas em modo leitura
        uses: actions/checkout@v4
        with:
          repository: ernanintcomercial/testing
          path: fontes-corporativas

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e conciliar bases
        run: >-
          python tools/update_from_xlsx.py entrada/nfs.xlsx
          --groups fontes-corporativas/Extracao.xlsx
          --priorities fontes-corporativas/Clientes_Prioritarios.xlsx
          --regions fontes-corporativas/INDEX.xlsx

      - name: Validar artefatos
        run: |
          python -m json.tool nfs.json > /dev/null
          python -m json.tool nfs-compact.json > /dev/null
          python -m json.tool historico-nfs.json > /dev/null

      - name: Publicar atualização no dashboard
        run: |
          if git diff --quiet -- nfs.json nfs-compact.json historico-nfs.json; then
            echo "Nenhuma alteração nos dados processados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfs.json nfs-compact.json historico-nfs.json
          git commit -m "Atualiza base e histórico de NFs"
          git push
